name: Refresh GitHub activity

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-activity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check calendar parser
        run: node --test scripts/github-contributions.test.mjs
      - name: Refresh public contribution data
        run: node scripts/sync-github-contributions.mjs
      - name: Save snapshot for Netlify continuous deployment
        run: |
          git add -- src/data/github-contributions.json
          if git diff --cached --quiet; then
            echo "No new snapshot to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh GitHub activity snapshot"
          git push
